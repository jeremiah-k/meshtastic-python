name: Docker Build and Publish

# Build and publish the mtjk Docker image to ghcr.io only on release.
# Manual dispatch is intentionally disabled. The release commit must be part of
# the trusted develop lineage before any image is built or published.

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jeremiah-k/mtjk
  RELEASE_TAG: ${{ github.event.release.tag_name }}

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    if: ${{ github.event.release.target_commitish != 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout trusted develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Refresh trusted develop and release tags
        run: |
          git fetch --force --tags origin '+refs/heads/develop:refs/remotes/origin/develop'
          git checkout --detach refs/remotes/origin/develop

      - name: Verify release source and package metadata
        id: release_source
        run: >-
          python bin/verify_release_source.py
          --tag "${RELEASE_TAG}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Checkout validated release commit
        run: git checkout --detach "${{ steps.release_source.outputs.commit }}"

      - name: Prepare build metadata
        id: build_info
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "build_date=${BUILD_DATE}" >> "${GITHUB_OUTPUT}"
          echo "git_sha=${{ steps.release_source.outputs.commit }}" >> "${GITHUB_OUTPUT}"
          echo "docker_tag=${{ steps.release_source.outputs.version }}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: |
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.build_info.outputs.docker_tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=mtjk
            org.opencontainers.image.description=Python API and CLI for Meshtastic devices (mtjk fork)
            org.opencontainers.image.url=https://github.com/jeremiah-k/mtjk
            org.opencontainers.image.source=https://github.com/jeremiah-k/mtjk
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ steps.release_source.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release_source.outputs.commit }}
            org.opencontainers.image.created=${{ steps.build_info.outputs.build_date }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.build_info.outputs.build_date }}
            VCS_REF=${{ steps.release_source.outputs.commit }}
            VERSION=${{ steps.release_source.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
