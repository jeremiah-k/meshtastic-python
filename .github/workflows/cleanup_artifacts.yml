name: Remove old artifacts

on:
  schedule:
    # Every day at 1am
    - cron: 0 1 * * *

  workflow_dispatch: {}

permissions:
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Remove old artifacts
        # v1.4.0
        uses: c-hive/gha-remove-artifacts@4bff15786ba0b91dd8ed7c32459eb72441ac1b6c # v1.7.0
        with:
          age: 1 month
          skip-tags: true
