name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    if: ${{ github.event.release.target_commitish != 'master' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_source.outputs.tag }}
      version: ${{ steps.release_source.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Refresh trusted develop and release tags
        run: |
          git fetch --force --tags origin '+refs/heads/develop:refs/remotes/origin/develop'
          git checkout --detach refs/remotes/origin/develop

      - name: Verify release source and package metadata
        id: release_source
        run: >-
          python bin/verify_release_source.py
          --tag "${RELEASE_TAG}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Checkout validated release commit
        env:
          RELEASE_COMMIT: ${{ steps.release_source.outputs.commit }}
        run: git checkout --detach "${RELEASE_COMMIT}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist-${{ steps.release_source.outputs.tag }}-${{ steps.release_source.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-dist-${{ needs.build.outputs.tag }}-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
